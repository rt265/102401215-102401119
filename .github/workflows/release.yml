name: Release

# 发布流程：
#   1. 推一个 v* 标签（如 v1.0.0）→ 构建 Android（分 ABI 的 release APK + AAB）
#      与 iOS（release、不签名），产物挂到对应 GitHub Release 上（README 的下载入口）。
#   2. 手动触发（workflow_dispatch）→ 只构建，产物作为 workflow artifact 保存；
#      填了 tag 输入才会创建 / 更新 Release。
#
# Android 正式签名（可选）：在仓库 Settings → Secrets and variables → Actions 配置
#   ANDROID_KEYSTORE_BASE64     keystore 文件的 base64（[Convert]::ToBase64String((Get-Content -AsByteStream keystore.jks))）
#   ANDROID_KEYSTORE_PASSWORD   keystore 密码
#   ANDROID_KEY_ALIAS           别名
#   ANDROID_KEY_PASSWORD        别名密码
# 四个都配了才会启用正式签名；没配则回退到 debug 签名（产物不能上架，仅供测试）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建/更新的 Release 标签（如 v1.0.0）；留空则只构建，不发 Release'
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  meta:
    name: 解析版本号
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算 tag 与版本号
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          pubspec_version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)

          tag=""
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi

          version="${tag#v}"
          if [ -z "$version" ]; then
            version="$pubspec_version"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-<无>} version=$version pubspec=$pubspec_version"

          if [ -n "$tag" ] && [ "$version" != "$pubspec_version" ]; then
            echo "::warning::标签 $tag 与 pubspec.yaml 的版本 $pubspec_version 不一致：产物按 $version 命名，versionCode 用 run number。"
          fi

  android:
    name: Android 产物（APK / AAB）
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PATH: android/app/release-keystore.jks
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装系统 SQLite 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 同 build.yml：剥掉仓库里仅本机可用的 Gradle 配置（代理 / 8G 堆 / 腾讯云镜像）。
      - name: 清理仅供本机使用的 Gradle 配置
        run: |
          set -euo pipefail
          f=android/gradle.properties
          grep -v -E '^systemProp\..*(proxyHost|proxyPort|nonProxyHosts)' "$f" > "$f.tmp" || true
          sed -e 's/-Xmx8G/-Xmx4g/' -e 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1G/' "$f.tmp" > "$f"
          rm -f "$f.tmp"

          w=android/gradle/wrapper/gradle-wrapper.properties
          gradle_version=$(sed -nE 's#.*gradle-([0-9][0-9.]*)-(all|bin)\.zip.*#\1#p' "$w" | head -n1)
          if [ -n "$gradle_version" ]; then
            sed -E "s#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip#" "$w" > "$w.tmp"
            mv "$w.tmp" "$w"
          fi

      # android/app/build.gradle.kts 只在 android/key.properties 存在时才启用 release 签名。
      - name: 写入正式签名配置
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storeFile=$PWD/$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已写入 android/key.properties（storeFile=$PWD/$KEYSTORE_PATH）"

      - name: 未配置签名 Secrets 时的提示
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD，本次产物用 debug 签名，不能用于上架。"

      - name: 构建 release APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: 构建 release App Bundle
        run: flutter build appbundle --release --build-name="$VERSION" --build-number="${{ github.run_number }}"

      # 汇总成扁平的 dist/，Release 附件里的路径才干净。
      - name: 汇总产物
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/lost-and-found-${VERSION}-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/lost-and-found-${VERSION}.aab"
          ls -lh dist

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS 产物（release、不签名）
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 iOS（不签名）
        run: flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="${{ github.run_number }}"

      # 未签名的 Runner.app 只能给开发者自己拖进 Xcode / 设备验证，装不到普通用户手机上。
      # 要出可分发的 ipa，需要 Apple 开发者证书 + provisioning profile，
      # 在 macOS 上改用 flutter build ipa --export-options-plist=... 即可（本仓库暂无证书）。
      - name: 打包 Runner.app
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "dist/lost-and-found-${VERSION}-ios-unsigned.zip"
          ls -lh dist

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 创建 GitHub Release
    needs: [ meta, android, ios ]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布的文件
        run: ls -lh dist

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: dist/*
