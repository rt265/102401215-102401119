name: Test

# 静态检查 + 单元 / 组件测试，对应本机命令（见 AGENTS.md）：
#   flutter pub get && flutter analyze && flutter test
#
# 本文件是「可复用工作流」（workflow_call），在 CI 里当**门禁**用：
#   build.yml / release.yml 各有一个
#     test: { uses: ./.github/workflows/test.yml }
#   job，后面的 android / ios 构建（release.yml 还有 publish）都 needs 它 ——
#   Test 不过，构建与发布就不会开始。
#
# 所以这里**不再监听 push / pull_request**：触发由 build.yml（push main、PR）、
# release.yml（v* 标签）负责，测试每次推送只跑一遍；workflow_dispatch 留给
# 「只想单独跑一次测试」的场景。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # 本机开发环境是 Flutter 3.47.5（见 docs/agents/basic-info.md）。
  # CI 跟随 stable；要固定版本就把下面这行换成 flutter-version: '3.47.5'
  # （subosito/flutter-action 的 channel / flutter-version 两个入参二选一）。
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # pubspec.yaml 里 sqlite3 配的是 source: system（本机访问 GitHub 不稳，原因见
      # docs/agents/basic-info.md），测试用 sqflite_common_ffi 在宿主上 dlopen
      # "libsqlite3.so"，所以 runner 必须先有系统 SQLite 运行库，否则 sqlite 相关
      # 用例会以 "Failed to load dynamic library" 失败。
      - name: 安装系统 SQLite 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 运行测试
        run: flutter test --coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
