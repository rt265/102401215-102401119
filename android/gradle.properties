org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 禁用 Kotlin 增量编译：增量缓存在关闭时用 RelocatableFileToPathConverter 计算源文件
# （C:\Users\...\Pub\Cache\...）与项目目录（D:\...\android）的相对路径，两个路径跨盘符
# （C: vs D:），toRelativeString 抛 IllegalArgumentException，导致 caches-jvm 关不掉、
# ':image_picker_android:compileDebugKotlin' 失败。关掉增量编译即可绕过该 bug。
kotlin.incremental=false

# 本机专用的代理 / 镜像配置不放在仓库里，改由用户级配置注入：
#   代理 —— ~/.gradle/gradle.properties 的 systemProp.http(s).proxyHost/Port
#   镜像 —— ~/.gradle/init.d/*.init.gradle 往 repositories / pluginManagement 里加阿里云源
# 详见 docs/agents/local-gradle-config.md。
